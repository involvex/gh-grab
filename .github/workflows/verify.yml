name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # bun lint / bun fmt are available on canary (stable treats them as scripts)
          bun-version: canary

      - name: Bun version
        run: bun --revision

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify
